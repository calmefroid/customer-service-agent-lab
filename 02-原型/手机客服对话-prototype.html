<!doctype html>
<html lang="zh-CN">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />

        safety: { items: [

  </script>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      --brand: #176b62;
      --brand-dark: #0f514b;
      --brand-soft: #eaf6f3;
      --ink: #172022;
      --muted: #667376;
      --line: #e5e9e8;
      --surface: #f5f7f6;
      --warning: #9c5b11;
      --warning-bg: #fff5e6;
      --danger: #b42318;
      --danger-bg: #fff0ee;
      --shadow: 0 18px 70px rgba(20, 38, 40, .16);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #edf2f1; color: var(--ink); }
    body { min-height: 100dvh; display: grid; place-items: center; }
    button, input, textarea { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    .phone {
      position: relative; width: min(390px, 100vw); height: min(844px, 100dvh); min-height: 620px;
      background: #fff; overflow: hidden; display: flex; flex-direction: column;
      box-shadow: var(--shadow); border: 1px solid rgba(23, 46, 48, .08); border-radius: 30px;
    }
    .history-note { padding: 7px 12px; color: #76520d; background: #fff7dc; border-bottom: 1px solid #eedca7; font-size: 11px; line-height: 1.4; text-align: center; }
    .app-header {
      z-index: 5; flex: 0 0 auto; display: flex; align-items: center; gap: 11px; padding: 15px 16px 13px;
      background: rgba(255,255,255,.96); border-bottom: 1px solid var(--line); backdrop-filter: blur(16px);
    }
    .avatar { width: 38px; height: 38px; border-radius: 13px; display: grid; place-items: center; background: var(--brand); color: #fff; box-shadow: 0 6px 16px rgba(23,107,98,.2); }
    .avatar .lucide { width: 20px; height: 20px; }
    .header-copy { min-width: 0; flex: 1; }
    .header-title { font-size: 16px; line-height: 21px; font-weight: 720; letter-spacing: -.2px; }
    .header-status { display: flex; align-items: center; gap: 5px; margin-top: 2px; color: var(--muted); font-size: 11px; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #2db882; box-shadow: 0 0 0 3px #e8f8f0; }
    .header-actions { display: flex; gap: 5px; }
    .icon-btn { width: 37px; height: 37px; display: grid; place-items: center; border: 0; border-radius: 12px; color: #4e5b5d; background: transparent; cursor: pointer; transition: .16s ease; }
    .icon-btn:active { transform: scale(.94); background: var(--surface); }
    .icon-btn .lucide { width: 19px; height: 19px; }
    .chat { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 18px 14px 22px; scroll-behavior: smooth; background: linear-gradient(180deg, #fbfdfc 0, #f6f8f7 100%); scrollbar-width: none; }
    .chat::-webkit-scrollbar { display: none; }
    .time-label { text-align: center; color: #98a2a4; font-size: 11px; margin: 0 0 16px; }
    .message-row { display: flex; align-items: flex-end; gap: 8px; margin: 0 0 14px; animation: rise .28s ease both; }
    .message-row.user { justify-content: flex-end; }
    .bot-mini { width: 27px; height: 27px; flex: 0 0 auto; border-radius: 9px; display: grid; place-items: center; background: var(--brand); color: #fff; margin-bottom: 2px; }
    .bot-mini .lucide { width: 15px; height: 15px; }
    .bubble { max-width: 79%; padding: 11px 13px; border-radius: 16px 16px 16px 5px; background: #fff; border: 1px solid var(--line); font-size: 14px; line-height: 1.55; box-shadow: 0 2px 8px rgba(30,48,49,.035); }
    .user .bubble { color: #fff; background: var(--brand); border-color: var(--brand); border-radius: 16px 16px 5px 16px; box-shadow: 0 6px 16px rgba(23,107,98,.14); }
    .bubble p { margin: 0; }
    .bubble p + p { margin-top: 7px; }
    .welcome { margin-bottom: 16px; }
    .quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 4px 0 18px 35px; animation: rise .32s ease both; }
    .quick-card { min-width: 0; min-height: 70px; text-align: left; padding: 11px 10px; border: 1px solid var(--line); border-radius: 14px; background: #fff; cursor: pointer; transition: .16s ease; }
    .quick-card:active { transform: scale(.975); background: var(--brand-soft); border-color: #b8dbd5; }
    .quick-icon { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 9px; color: var(--brand); background: var(--brand-soft); margin-bottom: 7px; }
    .quick-icon .lucide { width: 16px; height: 16px; }
    .quick-title { display: block; color: var(--ink); font-weight: 650; font-size: 13px; }
    .quick-sub { display: block; color: #849093; font-size: 10px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rich-card { margin: 6px 0 16px 35px; border: 1px solid var(--line); border-radius: 17px; overflow: hidden; background: #fff; box-shadow: 0 5px 18px rgba(34,59,59,.055); animation: rise .3s ease both; }
    .product-hero { display: grid; grid-template-columns: 78px 1fr; gap: 12px; padding: 12px; }
    .product-img { width: 78px; height: 78px; object-fit: cover; border-radius: 12px; background: #eee; }
    .card-kicker { color: var(--brand); font-weight: 650; font-size: 11px; margin-bottom: 4px; }
    .card-title { font-size: 14px; line-height: 1.35; font-weight: 720; }
    .model { color: var(--muted); font-size: 11px; margin-top: 3px; }
    .tag-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
    .tag { padding: 4px 7px; border-radius: 7px; background: var(--surface); color: #4b585a; font-size: 10px; }
    .card-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 10px; }
    .text-action { border: 0; background: transparent; color: var(--brand); font-weight: 680; font-size: 12px; padding: 4px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
    .text-action .lucide { width: 14px; height: 14px; }
    .assistant-tools { margin: -8px 0 15px 35px; display: flex; align-items: center; gap: 5px; animation: rise .3s ease both; }
    .tool-btn { width: 30px; height: 28px; border: 1px solid var(--line); border-radius: 9px; display: grid; place-items: center; background: #fff; color: #7b8789; cursor: pointer; }
    .tool-btn .lucide { width: 14px; height: 14px; }
    .tool-btn.selected { color: var(--brand); border-color: #b5d8d2; background: var(--brand-soft); }
    .typing { display: flex; gap: 4px; align-items: center; height: 20px; }
    .typing span { width: 6px; height: 6px; border-radius: 50%; background: #99a5a7; animation: blink 1s infinite ease-in-out; }
    .typing span:nth-child(2) { animation-delay: .14s; }
    .typing span:nth-child(3) { animation-delay: .28s; }
    .order-head { padding: 14px 14px 12px; display: flex; justify-content: space-between; gap: 12px; }
    .order-label { color: var(--muted); font-size: 10px; }
    .order-id { font-size: 12px; font-weight: 650; margin-top: 3px; }
    .state-pill { height: fit-content; padding: 5px 8px; border-radius: 999px; color: #11734b; background: #e9f8f0; font-weight: 700; font-size: 10px; }
    .eta { margin: 0 14px; padding: 10px 11px; border-radius: 11px; background: var(--brand-soft); color: var(--brand-dark); font-weight: 650; font-size: 13px; }
    .timeline { padding: 14px 14px 6px; }
    .event { position: relative; padding: 0 0 13px 20px; color: var(--muted); font-size: 11px; line-height: 1.4; }
    .event:before { content: ""; position: absolute; left: 3px; top: 4px; width: 7px; height: 7px; border-radius: 50%; background: #c8d0d0; z-index: 1; }
    .event:after { content: ""; position: absolute; left: 6px; top: 11px; width: 1px; bottom: -1px; background: #dce2e1; }
    .event:last-child:after { display: none; }
    .event.active { color: var(--ink); font-weight: 600; }
    .event.active:before { background: var(--brand); box-shadow: 0 0 0 4px var(--brand-soft); }
    .event-time { display: block; color: #98a2a4; font-weight: 400; margin-top: 2px; }
    .warning-card { margin: 6px 0 16px 35px; padding: 13px; border: 1px solid #f1d3a7; border-radius: 15px; background: var(--warning-bg); animation: rise .3s ease both; }
    .danger-card { border-color: #f2c4bf; background: var(--danger-bg); }
    .warning-top { display: flex; gap: 9px; align-items: flex-start; }
    .warning-top .lucide { flex: 0 0 auto; width: 18px; height: 18px; color: var(--warning); }
    .danger-card .warning-top .lucide { color: var(--danger); }
    .warning-title { font-size: 13px; font-weight: 750; color: #73430c; }
    .danger-card .warning-title { color: var(--danger); }
    .warning-copy { color: #745b3d; font-size: 11px; line-height: 1.55; margin-top: 4px; }
    .danger-card .warning-copy { color: #75443f; }
    .confirm-list { padding: 0 14px 9px; }
    .confirm-row { display: flex; justify-content: space-between; gap: 15px; padding: 8px 0; border-bottom: 1px dashed #e5e9e8; font-size: 11px; }
    .confirm-row:last-child { border-bottom: 0; }
    .confirm-key { color: var(--muted); flex: 0 0 68px; }
    .confirm-value { text-align: right; line-height: 1.4; font-weight: 580; }
    .card-actions { display: grid; grid-template-columns: 1fr 1.35fr; gap: 8px; padding: 10px 12px 12px; border-top: 1px solid var(--line); }
    .btn { height: 39px; border: 0; border-radius: 11px; font-size: 12px; font-weight: 700; cursor: pointer; transition: .16s ease; }
    .btn:active { transform: scale(.975); }
    .btn-secondary { background: var(--surface); color: #4a5759; }
    .btn-primary { background: var(--brand); color: #fff; box-shadow: 0 6px 14px rgba(23,107,98,.16); }
    .btn-danger { background: var(--danger); color: #fff; }
    .attachment-bubble { padding: 6px; }
    .message-image { display: block; max-width: 180px; max-height: 220px; border-radius: 12px; object-fit: cover; }
    .image-caption { padding: 7px 5px 3px; font-size: 11px; color: rgba(255,255,255,.82); }
    .success-line { display: flex; gap: 9px; align-items: flex-start; }
    .success-icon { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: #21a66f; flex: 0 0 auto; }
    .success-icon .lucide { width: 14px; height: 14px; }
    .composer-wrap { z-index: 6; flex: 0 0 auto; padding: 8px 10px calc(10px + env(safe-area-inset-bottom)); background: rgba(255,255,255,.97); border-top: 1px solid var(--line); backdrop-filter: blur(16px); }
    .pending-attachment { display: none; align-items: center; gap: 9px; padding: 8px 9px; margin: 0 1px 7px; border-radius: 12px; background: var(--surface); }
    .pending-attachment.show { display: flex; animation: rise .2s ease; }
    .pending-thumb { width: 42px; height: 42px; object-fit: cover; border-radius: 9px; background: #ddd; }
    .pending-copy { min-width: 0; flex: 1; }
    .pending-name { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pending-state { color: var(--muted); font-size: 10px; margin-top: 3px; }
    .remove-file { width: 28px; height: 28px; border: 0; background: #fff; border-radius: 9px; display: grid; place-items: center; color: var(--muted); cursor: pointer; }
    .remove-file .lucide { width: 15px; height: 15px; }
    .composer { display: flex; align-items: flex-end; gap: 7px; }
    .upload-btn { flex: 0 0 auto; width: 39px; height: 39px; border: 0; border-radius: 12px; background: var(--surface); color: #556366; display: grid; place-items: center; cursor: pointer; }
    .upload-btn .lucide { width: 19px; height: 19px; }
    .input-shell { flex: 1; min-width: 0; display: flex; align-items: flex-end; border: 1px solid #dfe5e4; background: #f8faf9; border-radius: 14px; transition: .16s ease; }
    .input-shell:focus-within { border-color: #83bdb5; background: #fff; box-shadow: 0 0 0 3px var(--brand-soft); }
    textarea { width: 100%; min-height: 39px; max-height: 92px; resize: none; border: 0; outline: 0; padding: 10px 11px 8px; background: transparent; color: var(--ink); font-size: 13px; line-height: 20px; }
    textarea::placeholder { color: #a3adae; }
    .send-btn { flex: 0 0 auto; width: 39px; height: 39px; border: 0; border-radius: 12px; display: grid; place-items: center; color: #fff; background: var(--brand); cursor: pointer; transition: .16s ease; }
    .send-btn:disabled { background: #c8d4d2; cursor: default; box-shadow: none; }
    .send-btn:not(:disabled):active { transform: scale(.94); }
    .send-btn .lucide { width: 18px; height: 18px; }
    .backdrop { position: absolute; inset: 0; z-index: 20; background: rgba(17,29,31,.38); opacity: 0; pointer-events: none; transition: .22s ease; }
    .backdrop.show { opacity: 1; pointer-events: auto; }
    .sheet { position: absolute; z-index: 21; left: 0; right: 0; bottom: 0; max-height: 78%; overflow-y: auto; padding: 10px 16px calc(18px + env(safe-area-inset-bottom)); background: #fff; border-radius: 22px 22px 0 0; transform: translateY(105%); transition: .26s cubic-bezier(.2,.8,.2,1); box-shadow: 0 -16px 40px rgba(18,37,39,.14); }
    .sheet.show { transform: translateY(0); }
    .sheet-handle { width: 36px; height: 4px; border-radius: 4px; background: #d8dfde; margin: 0 auto 15px; }
    .sheet-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .sheet-title { font-size: 18px; font-weight: 760; letter-spacing: -.3px; }
    .sheet-subtitle { color: var(--muted); font-size: 11px; line-height: 1.5; margin-top: 5px; }
    .sheet-close { width: 31px; height: 31px; border: 0; border-radius: 10px; background: var(--surface); color: var(--muted); display: grid; place-items: center; cursor: pointer; }
    .sheet-close .lucide { width: 16px; height: 16px; }
    .source-item { margin-top: 13px; padding: 13px; border: 1px solid var(--line); border-radius: 14px; }
    .source-meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .source-label { color: var(--brand); background: var(--brand-soft); border-radius: 7px; padding: 4px 7px; font-size: 10px; font-weight: 700; }
    .source-version { color: #8a9597; font-size: 10px; }
    .source-name { margin-top: 9px; font-size: 13px; font-weight: 700; }
    .source-excerpt { margin-top: 6px; color: var(--muted); font-size: 11px; line-height: 1.6; }
    .sheet-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
    .sheet-actions.one { grid-template-columns: 1fr; }
    .menu { position: absolute; z-index: 15; top: 62px; right: 12px; width: 178px; padding: 6px; border: 1px solid var(--line); border-radius: 14px; background: #fff; box-shadow: 0 15px 42px rgba(18,37,39,.15); opacity: 0; transform: translateY(-7px) scale(.98); pointer-events: none; transition: .16s ease; transform-origin: top right; }
    .menu.show { opacity: 1; transform: none; pointer-events: auto; }
    .menu-item { width: 100%; height: 42px; padding: 0 10px; border: 0; border-radius: 10px; background: transparent; color: #394648; display: flex; align-items: center; gap: 10px; font-size: 12px; cursor: pointer; }
    .menu-item:active { background: var(--surface); }
    .menu-item .lucide { width: 17px; height: 17px; color: #697678; }
    .toast { position: absolute; z-index: 30; left: 50%; top: 76px; transform: translate(-50%, -16px); max-width: 82%; padding: 9px 13px; border-radius: 11px; color: #fff; background: rgba(24,34,36,.9); font-size: 11px; line-height: 1.4; opacity: 0; pointer-events: none; transition: .22s ease; box-shadow: 0 8px 24px rgba(17,31,32,.18); }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .hidden { display: none !important; }
    @keyframes rise { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 0%, 70%, 100% { opacity: .35; transform: translateY(0); } 35% { opacity: 1; transform: translateY(-2px); } }
    @media (max-width: 520px) {
      body { display: block; background: #fff; }
      .phone { width: 100vw; height: 100dvh; min-height: 100dvh; border: 0; border-radius: 0; box-shadow: none; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <!-- 历史参考：本文件保留早期四入口探索，不是当前产品、契约或验收依据。当前实现位于 03-开发/应用工程，消费者端只有三个公开入口，产品知识走隐藏路由。 -->
  <main class="phone" aria-label="手机端智能客服原型">
    <div class="history-note">历史四入口原型 · 当前产品以 03-开发/应用工程为准</div>
    <header class="app-header">
      <div class="avatar"><i data-lucide="sparkles"></i></div>
      <div class="header-copy">
        <div class="header-title" id="brandName"></div>
        <div class="header-status"><span class="status-dot"></span><span id="brandStatus"></span></div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="humanBtn" aria-label="转人工"><i data-lucide="headphones"></i></button>
        <button class="icon-btn" id="menuBtn" aria-label="更多"><i data-lucide="ellipsis"></i></button>
      </div>
    </header>

    <section class="chat" id="chat" aria-live="polite"></section>

    <footer class="composer-wrap">
      <div class="pending-attachment" id="pendingAttachment">
        <img class="pending-thumb" id="pendingThumb" alt="待发送图片预览" />
        <div class="pending-copy"><div class="pending-name" id="pendingName"></div><div class="pending-state">可补充描述后一起发送</div></div>
        <button class="remove-file" id="removeFile" aria-label="移除图片"><i data-lucide="x"></i></button>
      </div>
      <div class="composer">
        <button class="upload-btn" id="uploadBtn" aria-label="上传图片"><i data-lucide="image-plus"></i></button>
        <input class="hidden" id="fileInput" type="file" accept="image/png,image/jpeg,image/webp" />
        <div class="input-shell"><textarea id="messageInput" rows="1" placeholder="请输入你的问题" aria-label="消息内容"></textarea></div>
        <button class="send-btn" id="sendBtn" disabled aria-label="发送"><i data-lucide="send-horizontal"></i></button>
      </div>
    </footer>

    <div class="menu" id="menu">
      <button class="menu-item" id="restartBtn"><i data-lucide="rotate-ccw"></i>重新开始会话</button>
      <button class="menu-item" id="helpBtn"><i data-lucide="circle-help"></i>查看服务范围</button>
    </div>
    <div class="backdrop" id="backdrop"></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></section>
    <div class="toast" id="toast"></div>
  </main>

  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const fileInput = document.getElementById('fileInput');
    const pending = document.getElementById('pendingAttachment');
    const sheet = document.getElementById('sheet');
    const backdrop = document.getElementById('backdrop');
    const menu = document.getElementById('menu');
    let pendingFile = null;
    let pendingUrl = '';
    let busy = false;
    let messageSeq = 0;

    const icon = (name) => `<i data-lucide="${name}"></i>`;
    const refreshIcons = () => window.lucide && lucide.createIcons({ attrs: { 'stroke-width': 1.9 } });
    const scrollBottom = () => requestAnimationFrame(() => { chat.scrollTop = chat.scrollHeight; });
    const escapeHtml = (value = '') => value.replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));

    function botMessage(html, { tools = true } = {}) {
      const id = `msg-${++messageSeq}`;
      chat.insertAdjacentHTML('beforeend', `<div class="message-row" id="${id}"><div class="bot-mini">${icon('sparkles')}</div><div class="bubble">${html}</div></div>${tools ? assistantTools(id) : ''}`);
      refreshIcons(); scrollBottom(); return id;
    }
    function userMessage(html, imageUrl = '') {
      const content = imageUrl ? `<div class="bubble attachment-bubble"><img class="message-image" src="${imageUrl}" alt="用户上传的售后图片" />${html ? `<div class="image-caption">${html}</div>` : ''}</div>` : `<div class="bubble">${html}</div>`;
      chat.insertAdjacentHTML('beforeend', `<div class="message-row user">${content}</div>`);
      refreshIcons(); scrollBottom();
    }
    function assistantTools(messageId) {
      return `<div class="assistant-tools" data-for="${messageId}"><button class="tool-btn" aria-label="有帮助" onclick="rate(this, true)">${icon('thumbs-up')}</button><button class="tool-btn" aria-label="没帮助" onclick="rate(this, false)">${icon('thumbs-down')}</button><button class="tool-btn" aria-label="复制" onclick="copyAnswer('${messageId}', this)">${icon('copy')}</button></div>`;
    }
    function typing() {
      const id = `typing-${Date.now()}`;
      chat.insertAdjacentHTML('beforeend', `<div class="message-row" id="${id}"><div class="bot-mini">${icon('sparkles')}</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div></div>`);
      refreshIcons(); scrollBottom(); return id;
    }
    const delay = ms => new Promise(resolve => setTimeout(resolve, ms));
    async function think(min = 650) { const id = typing(); await delay(min); document.getElementById(id)?.remove(); }

    function init() {
      document.getElementById('brandName').textContent = mockData.brand.name;
      document.getElementById('brandStatus').textContent = mockData.brand.status;
      chat.innerHTML = `<div class="time-label">今天</div>`;
      botMessage(`<p>${mockData.brand.greeting}</p><p style="color:#738082;font-size:12px">你也可以上传商品、包装破损或铭牌照片。</p>`, { tools: false });
      const actions = mockData.quickActions.map(a => `<button class="quick-card" onclick="runQuick('${a.id}')"><span class="quick-icon">${icon(a.icon)}</span><span class="quick-title">${a.title}</span><span class="quick-sub">${a.subtitle}</span></button>`).join('');
      chat.insertAdjacentHTML('beforeend', `<div class="quick-grid" id="quickGrid">${actions}</div>`);
      refreshIcons(); scrollBottom();
    }

    async function runQuick(type) {
      if (busy) return;
      const textMap = { product: '20 平米的客厅，主灯应该怎么选？', logistics: '帮我查一下订单到哪里了', return: '刚收到灯，灯罩破了，怎么换？', fault: '客厅灯一直闪，应该怎么办？' };
      userMessage(escapeHtml(textMap[type]));
      document.getElementById('quickGrid')?.remove();
      busy = true; await think();
      if (type === 'product') renderProduct();
      if (type === 'logistics') askIdentity();
      if (type === 'return') askPhoto();
      if (type === 'fault') renderFault();
      busy = false;
    }

    function renderProduct() {
      const p = mockData.product;
      botMessage(`<p>20㎡客厅建议优先看 <strong>18–25㎡适用范围</strong>的主灯。若层高低于 2.6m 或墙面颜色较深，建议再确认安装高度和照度需求。</p>`);
      chat.insertAdjacentHTML('beforeend', `<article class="rich-card"><div class="product-hero"><img class="product-img" src="${p.image}" alt="${p.name}" /><div><div class="card-kicker">适配你的空间</div><div class="card-title">${p.name}</div><div class="model">${p.model}</div><div class="tag-row">${p.specs.map(s => `<span class="tag">${s}</span>`).join('')}</div></div></div></article>`);
      recordTrace('product', 'product_consult');
      refreshIcons(); scrollBottom();
    }

    function askIdentity() {
      botMessage(`<p>可以。订单信息仅对本人开放，请先确认使用当前账号查询。</p>`, { tools: false });
      chat.insertAdjacentHTML('beforeend', `<article class="rich-card"><div style="padding:14px"><div class="card-kicker">安全验证</div><div class="card-title">确认查询当前账号的订单</div><div class="model" style="margin-top:6px">手机号尾号 6821 · 仅用于本次查询</div></div><div class="card-actions"><button class="btn btn-secondary" onclick="cancelIdentity()">暂不查询</button><button class="btn btn-primary" onclick="confirmIdentity(this)">确认本人</button></div></article>`);
      refreshIcons(); scrollBottom();
    }
    async function confirmIdentity(btn) {
      btn.disabled = true; btn.textContent = '正在查询…'; await delay(850);
      btn.closest('.rich-card').remove();
      botMessage(`<p>已找到最近一笔灯具订单，目前正在运输中。</p>`);
      renderOrder();
    }
    function cancelIdentity() { document.querySelector('.rich-card:last-of-type')?.remove(); botMessage('<p>好的，我没有查询订单。你可以继续咨询其他问题。</p>'); }
    function renderOrder() {
      const o = mockData.order;
      const events = o.events.map(e => `<div class="event ${e.active ? 'active' : ''}">${e.text}<span class="event-time">${e.time}</span></div>`).join('');
      chat.insertAdjacentHTML('beforeend', `<article class="rich-card"><div class="order-head"><div><div class="order-label">订单号</div><div class="order-id">${o.id}</div></div><span class="state-pill">${o.status}</span></div><div class="eta">${icon('clock-3')} <span style="vertical-align:2px;margin-left:5px">${o.eta}</span></div><div class="timeline">${events}</div><div class="card-foot" style="justify-content:flex-end"><button class="text-action" onclick="showToast('物流信息已刷新')">刷新物流 ${icon('refresh-cw')}</button></div></article>`);
      recordTrace('order', 'logistics_query', { sourceSystem: 'OMS / TMS', sourceUpdatedAt: '刚刚' });
      refreshIcons(); scrollBottom();
    }

    function askPhoto() {
      botMessage(`<p>很抱歉影响使用。请上传一张<strong>灯罩破损处和外包装</strong>的清晰照片，我会先识别可见情况，再帮你整理换货申请。</p><p style="color:#738082;font-size:12px">照片不能单独决定责任或赔偿结果。</p>`);
      setTimeout(() => document.getElementById('uploadBtn').classList.add('selected'), 50);
    }

    function renderFault() {
      botMessage(`<p>先不要拆灯。请确认闪烁时是否同时出现<strong>烧焦味、冒烟或异常发热</strong>？</p>`, { tools: false });
      chat.insertAdjacentHTML('beforeend', `<article class="rich-card"><div style="padding:13px 14px"><div class="card-kicker">请选择实际情况</div><div class="tag-row" style="margin-top:8px"><button class="btn btn-secondary" style="padding:0 12px" onclick="faultChoice(false)">只是闪烁</button><button class="btn btn-danger" style="padding:0 12px" onclick="faultChoice(true)">有异味 / 冒烟</button></div></div></article>`);
      refreshIcons(); scrollBottom();
    }
    async function faultChoice(danger) {
      document.querySelector('.rich-card:last-of-type')?.remove();
      userMessage(danger ? '有烧焦味，好像还冒烟' : '只是闪烁，没有异味或冒烟');
      await think(550);
      if (danger) {
        botMessage('<p><strong>请立即关闭对应电源并停止使用，不要触碰灯体或自行拆解。</strong>我会为你优先转接人工客服。</p>', { tools: false });
        chat.insertAdjacentHTML('beforeend', `<div class="warning-card danger-card"><div class="warning-top">${icon('triangle-alert')}<div><div class="warning-title">已识别用电安全风险</div><div class="warning-copy">保持断电并远离异常灯具；如出现明火，请先确保人员安全并联系紧急服务。</div></div></div></div>`);
        recordTrace('safety', 'human_escalation');
        refreshIcons(); scrollBottom(); await delay(500); humanConnected(true);
      } else {
        botMessage('<p>请先关闭灯具电源 30 秒后重新开启，并确认其他灯具是否正常。若仍持续闪烁，我可以帮你创建售后工单。</p>');
        chat.insertAdjacentHTML('beforeend', `<article class="rich-card"><div style="padding:13px 14px"><div class="card-title">需要创建售后工单吗？</div><div class="model">提交前会让你确认产品、故障和联系方式</div></div><div class="card-actions"><button class="btn btn-secondary" onclick="showToast('已保留排查建议')">稍后再说</button><button class="btn btn-primary" onclick="renderTicketConfirm()">创建工单</button></div></article>`);
        refreshIcons(); scrollBottom();
      }
    }

    function renderTicketConfirm() {
      document.querySelector('.rich-card:last-of-type')?.remove();
      const rows = [['服务类型','灯具故障报修'],['产品','悦享系列 LED 吸顶灯'],['故障描述','持续闪烁，无异味或冒烟'],['联系方式','手机号尾号 6821']];
      renderConfirm('确认提交售后工单', rows, '提交工单', 'SV20260820017');
    }

    function renderReturnConfirm() {
      const d = mockData.returnDraft;
      const rows = [['服务类型',d.type],['商品',d.product],['可见情况',`${d.reason}（待人工复核）`],['凭证',d.evidence],['联系方式',d.contact],['取件地址',d.address]];
      renderConfirm('确认换货申请信息', rows, '确认提交', 'RT20260820028');
      chat.insertAdjacentHTML('beforeend', `<div class="card-foot" style="margin:-17px 0 16px 35px;background:#fff;border:1px solid var(--line);border-top:0;border-radius:0 0 17px 17px"><span>提交后由售后人员审核</span></div>`);
      recordTrace('return', 'return_exchange');
      refreshIcons(); scrollBottom();
    }

    // 这里对应“任何写操作必须先展示摘要并获得用户明确确认”的规则。
    function renderConfirm(title, rows, actionText, successNo) {
      botMessage(`<p>我已整理好申请信息，请确认无误后再提交。</p>`, { tools: false });
      chat.insertAdjacentHTML('beforeend', `<article class="rich-card confirm-card"><div style="padding:14px"><div class="card-kicker">提交前确认</div><div class="card-title">${title}</div></div><div class="confirm-list">${rows.map(([k,v]) => `<div class="confirm-row"><span class="confirm-key">${k}</span><span class="confirm-value">${v}</span></div>`).join('')}</div><div class="card-actions"><button class="btn btn-secondary" onclick="modifyConfirm(this)">返回修改</button><button class="btn btn-primary" onclick="submitConfirm(this, '${successNo}')">${actionText}</button></div></article>`);
      refreshIcons(); scrollBottom();
    }
    function modifyConfirm(btn) { btn.closest('.rich-card').remove(); botMessage('<p>可以，请直接告诉我需要修改哪一项。</p>'); input.focus(); }
    async function submitConfirm(btn, no) {
      btn.disabled = true; btn.textContent = '正在提交…'; await delay(1100);
      btn.closest('.rich-card').remove();
      botMessage(`<div class="success-line"><span class="success-icon">${icon('check')}</span><div><strong>申请已提交</strong><p style="margin-top:4px;color:#637073;font-size:12px">服务编号：${no}<br>进展会通过当前账号消息通知你。</p></div></div>`);
      refreshIcons();
    }

    async function handleImageMessage(text) {
      const imageUrl = pendingUrl;
      userMessage(escapeHtml(text), imageUrl);
      clearAttachment(false); busy = true; await think(900);
      botMessage('<p>从照片中看到灯罩边缘有一处明显裂纹，外包装局部受压。<strong>破损原因和责任暂时无法仅凭照片确认。</strong></p>');
      chat.insertAdjacentHTML('beforeend', `<div class="warning-card"><div class="warning-top">${icon('scan-line')}<div><div class="warning-title">图片识别结果</div><div class="warning-copy">已识别：灯罩边缘裂纹、包装受压<br>无法确认：是否影响灯体内部、破损责任</div></div></div></div>`);
      refreshIcons(); scrollBottom(); await delay(400); renderReturnConfirm(); busy = false;
    }

    async function handleTextMessage(text) {
      userMessage(escapeHtml(text)); busy = true; await think();
      const value = text.toLowerCase();
      if (/冒烟|烧焦|触电|火花|异味/.test(value)) {
        botMessage('<p><strong>请立即断开对应电源并停止使用，不要触碰或拆解灯具。</strong>我正在为你转接人工客服。</p>', { tools: false });
        chat.insertAdjacentHTML('beforeend', `<div class="warning-card danger-card"><div class="warning-top">${icon('triangle-alert')}<div><div class="warning-title">安全风险：请先确保断电</div><div class="warning-copy">如果出现明火，请先远离现场并联系紧急服务。</div></div></div></div>`);
        recordTrace('safety', 'human_escalation');
        refreshIcons(); scrollBottom(); await delay(450); humanConnected(true);
      } else if (/物流|到哪|发货|快递|订单/.test(value)) {
        askIdentity();
      } else if (/破|碎|退货|换货|少件|错发/.test(value)) {
        askPhoto();
      } else if (/闪|不亮|故障|坏了/.test(value)) {
        renderFault();
      } else if (/人工|客服人员|真人/.test(value)) {
        openHumanSheet();
      } else if (/客厅|卧室|怎么选|适合|多少平|色温|功率/.test(value)) {
        renderProduct();
      } else {
        botMessage('<p>我还需要一点信息才能准确处理。请问你咨询的是<strong>产品选购、订单物流、退换售后</strong>，还是<strong>灯具故障</strong>？</p>');
        const actions = mockData.quickActions.map(a => `<button class="quick-card" onclick="runQuick('${a.id}')"><span class="quick-icon">${icon(a.icon)}</span><span class="quick-title">${a.title}</span><span class="quick-sub">${a.subtitle}</span></button>`).join('');
        chat.insertAdjacentHTML('beforeend', `<div class="quick-grid">${actions}</div>`); refreshIcons(); scrollBottom();
      }
      busy = false;
    }

    function sendMessage() {
      const text = input.value.trim();
      if (busy || (!text && !pendingFile)) return;
      input.value = ''; resizeInput(); updateSend();
      if (pendingFile) handleImageMessage(text || '这是刚收到的灯具照片'); else handleTextMessage(text);
    }

    function selectFile(file) {
      if (!file) return;
      if (!['image/jpeg','image/png','image/webp'].includes(file.type)) { showToast('仅支持 JPG、PNG、WEBP 图片'); return; }
      if (file.size > 8 * 1024 * 1024) { showToast('图片不能超过 8MB'); return; }
      if (pendingUrl) URL.revokeObjectURL(pendingUrl);
      pendingFile = file; pendingUrl = URL.createObjectURL(file);
      document.getElementById('pendingThumb').src = pendingUrl;
      document.getElementById('pendingName').textContent = file.name;
      pending.classList.add('show'); updateSend(); refreshIcons();
    }
    function clearAttachment(revoke = true) {
      if (revoke && pendingUrl) URL.revokeObjectURL(pendingUrl);
      pendingFile = null; pendingUrl = ''; fileInput.value = ''; pending.classList.remove('show'); updateSend();
    }

    // 原型用内存数组模拟后台 Trace；正式项目由服务端持久化并在后台查询。
    function recordTrace(sourceType, intent, extra = {}) {
      window.__serviceTrace = window.__serviceTrace || [];
      const source = mockData.traceSources[sourceType];
      window.__serviceTrace.push({
        traceId: `TR${Date.now()}`,
        intent,
        sourceType,
        recordedAt: new Date().toISOString(),
        evidence: source ? source.items : [],
        ...extra
      });
      // 仅用于原型自动化验收，不渲染到消费者界面。
      document.documentElement.dataset.traceCount = String(window.__serviceTrace.length);
      document.documentElement.dataset.lastTraceSource = sourceType;
    }
    function openHumanSheet() {
      openSheet(`<div class="sheet-handle"></div><div class="sheet-title-row"><div><div class="sheet-title" id="sheetTitle">转接人工客服</div><div class="sheet-subtitle">我会把当前问题和已确认的信息一并转交，你不需要重复描述。</div></div><button class="sheet-close" onclick="closeSheet()">${icon('x')}</button></div><div class="source-item"><div class="source-name">本次会话摘要</div><div class="source-excerpt">咨询灯具产品与售后服务；当前会话中未提交待确认的服务申请。</div></div><div class="sheet-actions"><button class="btn btn-secondary" onclick="closeSheet()">继续问机器人</button><button class="btn btn-primary" onclick="humanConnected(false)">确认转人工</button></div>`);
    }
    function openHelp() {
      openSheet(`<div class="sheet-handle"></div><div class="sheet-title-row"><div><div class="sheet-title" id="sheetTitle">我可以帮你</div><div class="sheet-subtitle">覆盖灯具购买前到售后的主要服务场景。</div></div><button class="sheet-close" onclick="closeSheet()">${icon('x')}</button></div><div class="source-item"><div class="source-name">产品与购买咨询</div><div class="source-excerpt">空间适配、产品参数、安装条件和渠道服务。</div></div><div class="source-item"><div class="source-name">订单与物流</div><div class="source-excerpt">身份确认后查询订单、发货与配送进度。</div></div><div class="source-item"><div class="source-name">退换与售后</div><div class="source-excerpt">破损、缺件、错发、故障排查和服务申请。</div></div><div class="sheet-actions one"><button class="btn btn-primary" onclick="closeSheet()">开始咨询</button></div>`);
    }
    function openSheet(html) { menu.classList.remove('show'); sheet.innerHTML = html; backdrop.classList.add('show'); sheet.classList.add('show'); refreshIcons(); }
    function closeSheet() { backdrop.classList.remove('show'); sheet.classList.remove('show'); setTimeout(() => { if (!sheet.classList.contains('show')) sheet.innerHTML = ''; }, 280); }
    function humanConnected(priority) {
      closeSheet();
      setTimeout(() => {
        botMessage(`<p><strong>${priority ? '已优先转接安全专席' : '已进入人工客服队列'}</strong></p><p style="color:#637073;font-size:12px">当前会话摘要已同步，预计等待约 1 分钟。你可以继续补充信息。</p>`, { tools: false });
      }, 260);
    }

    function rate(btn, positive) {
      const group = btn.parentElement; [...group.children].forEach(b => b.classList.remove('selected')); btn.classList.add('selected'); showToast(positive ? '感谢反馈，已记录“有帮助”' : '已记录，我们会继续改进');
    }
    async function copyAnswer(id, btn) {
      const text = document.getElementById(id)?.innerText || '';
      try { await navigator.clipboard.writeText(text); btn.classList.add('selected'); showToast('回答已复制'); } catch { showToast('当前浏览器不支持自动复制'); }
    }
    function showToast(text) { const el = document.getElementById('toast'); el.textContent = text; el.classList.add('show'); clearTimeout(showToast.timer); showToast.timer = setTimeout(() => el.classList.remove('show'), 1800); }
    function resizeInput() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 92) + 'px'; }
    function updateSend() { sendBtn.disabled = busy || (!input.value.trim() && !pendingFile); }

    document.getElementById('uploadBtn').addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', e => selectFile(e.target.files[0]));
    document.getElementById('removeFile').addEventListener('click', () => clearAttachment());
    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('input', () => { resizeInput(); updateSend(); });
    input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
    document.getElementById('humanBtn').addEventListener('click', openHumanSheet);
    document.getElementById('menuBtn').addEventListener('click', e => { e.stopPropagation(); menu.classList.toggle('show'); });
    document.getElementById('restartBtn').addEventListener('click', () => { menu.classList.remove('show'); clearAttachment(); init(); showToast('已开始新会话'); });
    document.getElementById('helpBtn').addEventListener('click', openHelp);
    backdrop.addEventListener('click', closeSheet);
    document.addEventListener('click', e => { if (!menu.contains(e.target) && !document.getElementById('menuBtn').contains(e.target)) menu.classList.remove('show'); });

    init();
  </script>
</body>
</html>
